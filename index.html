<!DOCTYPE html>
<html lang="kk" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>neuroUstaz · Ойнап үйренеміз!</title>
<meta name="description" content="neuroUstaz — 1–4 сыныптарға арналған интерактивті ойындар: математика, сауат ашу. Интерактивті тақтаға ыңғайлы.">
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="logo-full.png"><meta property="og:image" content="logo-full.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--blue:#1e88e5;--red:#e53935;--green:#43a047;--yellow:#fdd835;--ink:#1a2a5a}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,#29a3f5,#1565c0) fixed;min-height:100vh;user-select:none;-webkit-user-select:none}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 8% 20%,#ffffff22 0 60px,transparent 61px),radial-gradient(circle at 92% 12%,#ffffff1a 0 90px,transparent 91px),radial-gradient(circle at 85% 80%,#ffffff14 0 120px,transparent 121px),radial-gradient(circle at 15% 85%,#ffffff12 0 80px,transparent 81px)}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
.tbtn{background:#fff;color:var(--ink);font-size:20px;font-weight:900;padding:12px 20px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.2);white-space:nowrap}
.tbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.2)}
header{position:relative;text-align:center;color:#fff;padding:22px 20px 6px}
header .tl{position:absolute;left:22px;top:22px}header .tr{position:absolute;right:22px;top:22px;display:flex;gap:10px}
.brand{display:inline-flex;align-items:center;gap:14px;cursor:pointer}
.lg{width:74px;height:74px;border-radius:50%;background:url(logo-full.png) center/cover;box-shadow:0 0 0 5px #fff,0 8px 0 5px rgba(0,0,0,.15);flex:none}
h1{font-size:clamp(34px,4.4vw,60px);font-weight:900;text-shadow:0 5px 0 rgba(0,0,0,.2)}
.sub{font-size:24px;font-weight:900;opacity:.95;margin-top:2px;text-shadow:0 3px 0 rgba(0,0,0,.15);min-height:32px}
.qs{display:flex;gap:12px;justify-content:center;margin:16px 0 4px;flex-wrap:wrap}
.qs button{font-size:22px;font-weight:900;padding:12px 24px;border-radius:999px;background:#ffffff33;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.qs button.on{background:var(--yellow);color:var(--ink)}
.qs button.lock{opacity:.6;cursor:default}
.wrap{max-width:1560px;margin:0 auto;padding:10px 26px 90px;position:relative}
/* сыныптар */
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:28px;max-width:1300px;margin:28px auto 0}
.gc{border-radius:36px;padding:34px 10px 28px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 10px 0 rgba(0,0,0,.22);border:6px solid rgba(255,255,255,.85);transition:transform .15s}
.gc:hover{transform:translateY(-6px) rotate(-1deg)}.gc:active{transform:translateY(8px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.gc .em{font-size:54px}.gc .gn{font-size:clamp(90px,10vw,150px);font-weight:900;line-height:1;text-shadow:0 6px 0 rgba(0,0,0,.2)}
.gc .gt{font-size:clamp(28px,3vw,42px);font-weight:900;letter-spacing:2px}
.gc .gd{font-size:20px;font-weight:800;background:rgba(0,0,0,.18);padding:4px 16px;border-radius:14px;margin-top:6px}
/* пәндер */
.subs{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;max-width:1300px;margin:26px auto 0}
.sc{background:#fff;border-radius:30px;padding:24px;display:flex;align-items:center;gap:20px;text-align:left;box-shadow:0 9px 0 rgba(0,0,0,.18);position:relative;transition:transform .15s}
.sc:hover{transform:translateY(-5px)}.sc:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.sc .ic{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:50px;flex:none}
.sc b{display:block;font-size:28px;font-weight:900;line-height:1.1}.sc span{font-size:17px;font-weight:700;opacity:.6}
.sc.off{opacity:.75;cursor:default}.sc.off:hover{transform:none}.sc.off .ic{filter:grayscale(.6)}
.soon{position:absolute;top:12px;right:-8px;background:#ffffffee;color:#5a6a8a;font-size:14px;font-weight:900;padding:5px 12px;border-radius:12px;transform:rotate(6deg);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.cnt{position:absolute;top:12px;right:-8px;background:var(--yellow);color:var(--ink);font-size:14px;font-weight:900;padding:5px 12px;border-radius:12px;transform:rotate(6deg);box-shadow:0 4px 0 rgba(0,0,0,.15)}
/* ойындар */
.sec{margin-top:34px}
.sh{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:18px;color:#fff}
.si{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.sh h2{font-size:clamp(30px,3vw,44px);font-weight:900;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.sh span{font-size:18px;font-weight:900;background:#ffffff2e;border-radius:999px;padding:6px 14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px}
.card{background:#fff;border-radius:30px;padding:22px 14px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 9px 0 rgba(0,0,0,.18);transition:transform .15s;position:relative;text-align:center}
.card:hover{transform:translateY(-6px) rotate(-1deg)}
.card:active{transform:translateY(6px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
.card .ic{width:112px;height:112px;border-radius:50%;display:grid;place-items:center;font-size:60px}
.card:hover .ic{animation:bob .6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-6px) scale(1.05)}}
.n{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:900;font-size:17px;display:grid;place-items:center}
.card b{font-size:23px;font-weight:900;line-height:1.15}
.card p{font-size:16px;font-weight:700;opacity:.6;line-height:1.25;flex:1}
.md{font-size:15px;font-weight:900;padding:6px 12px;border-radius:999px;color:#fff}
.md.s{background:#1e88e5}.md.d{background:#e53935}.md.c{background:#8e24aa}
.st{font-size:18px;letter-spacing:2px;color:#ffb300;min-height:24px}
.st i{font-style:normal;color:#dfe3ec}
.empty{color:#fff;text-align:center;font-size:30px;font-weight:900;margin-top:60px;text-shadow:0 4px 0 rgba(0,0,0,.2)}
.empty div{font-size:110px}
/* терезе */
.ov{position:fixed;inset:0;background:#0d2a6bcc;display:none;align-items:center;justify-content:center;z-index:9;padding:20px}
.ov.on{display:flex}
.mb{background:#fff;border-radius:36px;max-width:620px;width:100%;padding:30px;text-align:center;box-shadow:0 12px 0 rgba(0,0,0,.2);animation:pop .25s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
.mb .ic{width:170px;height:170px;border-radius:50%;display:grid;place-items:center;font-size:100px;margin:0 auto 12px}
.mb h3{font-size:38px;font-weight:900}
.mb p{font-size:20px;font-weight:700;opacity:.65;margin:6px 0 20px}
.lvs{display:flex;gap:12px;margin-bottom:20px}
.lvs button{flex:1;padding:16px 6px;border-radius:22px;font-weight:900;font-size:21px;color:#fff;box-shadow:0 6px 0 rgba(0,0,0,.2);border:5px solid transparent;opacity:.75}
.lvs button.on{border-color:var(--ink);opacity:1;transform:translateY(-3px)}
.lvs .e{background:#43a047}.lvs .m{background:#fb8c00}.lvs .h{background:#e53935}
.go{width:100%;padding:20px;border-radius:24px;background:var(--yellow);color:var(--ink);font-size:30px;font-weight:900;box-shadow:0 8px 0 #c7a500}
.go:active{transform:translateY(6px);box-shadow:0 2px 0 #c7a500}
.x{margin-top:14px;font-weight:900;font-size:18px;opacity:.55}
footer{color:#fff;text-align:center;font-weight:800;opacity:.85;padding:30px 0 10px;font-size:16px}
@media(max-width:1250px){.grid{grid-template-columns:repeat(3,1fr)}.subs{grid-template-columns:repeat(2,1fr)}}
@media(max-width:800px){.grades{grid-template-columns:repeat(2,1fr);gap:16px}}
@media(max-width:700px){header{padding-top:78px}header .tl{left:12px;top:14px}header .tr{right:12px;top:14px}.tbtn{font-size:15px;padding:8px 12px}h1{font-size:30px}
 .lg{width:54px;height:54px}.sub{font-size:17px}.qs button{font-size:15px;padding:8px 14px}.grid{grid-template-columns:repeat(2,1fr);gap:14px}.card .ic{width:76px;height:76px;font-size:42px}
 .card b{font-size:17px}.card p{display:none}.wrap{padding:6px 12px 40px}.sh span{display:none}.lvs button{font-size:15px}.subs{grid-template-columns:1fr}.sc .ic{width:70px;height:70px;font-size:36px}.sc b{font-size:22px}
 .gc .em{font-size:36px}.gc .gd{font-size:14px}}
</style>
</head>
<body>
<header>
  <div class="tl"><button class="tbtn" id="back" style="visibility:hidden">⬅ Артқа</button></div>
  <div class="tr"><button class="tbtn" id="fs" title="Толық экран">⛶</button></div>
  <div class="brand" id="home"><div class="lg" role="img" aria-label="neuroUstaz"></div><h1>Ойнап үйренеміз!</h1></div>
  <div class="sub" id="sub"></div>
  <div class="qs" id="qs"></div>
</header>
<div class="wrap" id="wrap"></div>
<footer>neuroUstaz · балалар нейропедагогика орталығы · Астана</footer>

<div class="ov" id="ov"><div class="mb">
  <div class="ic" id="mic"></div><h3 id="mt"></h3><p id="mp"></p>
  <div class="lvs" id="lvs"><button class="e" data-l="1">⭐ Жеңіл</button><button class="m" data-l="2">⭐⭐ Орташа</button><button class="h" data-l="3">⭐⭐⭐ Қиын</button></div>
  <button class="go" id="go">▶ ОЙНАУ!</button><br><button class="x" id="mx">Жабу</button>
</div></div>

<script src="data.js?v=38"></script>
<script>
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const go=h=>{location.hash=h};
$('#home').onclick=()=>go('');
$('#fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};

function route(){const p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);const W=$('#wrap');W.innerHTML='';$('#qs').innerHTML='';
 const back=$('#back');back.style.visibility=p.length?'visible':'hidden';scrollTo(0,0);
 if(!p.length){$('#sub').textContent='Сыныпты таңда';back.onclick=null;
  const g=el('div','grades');GRADES.forEach(G=>{const b=el('button','gc',`<div class="em">${G.em}</div><div class="gn">${G.n}</div><div class="gt">СЫНЫП</div><div class="gd">${G.d}</div>`);b.style.background=G.c;b.onclick=()=>go('/'+G.n);g.append(b)});W.append(g);return}
 const g=+p[0];
 if(p.length===1){$('#sub').textContent=g+'-сынып · Пәнді таңда';back.onclick=()=>go('');
  const s=el('div','subs');SUBJ(g).forEach(S=>{const has=Object.keys(CAT).some(k=>k.startsWith(g+'/'+S.id+'/'));
   const b=el('button','sc'+(has?'':' off'),`<div class="ic" style="background:${S.c}">${S.em}</div><div><b>${S.t}</b><span>${S.d}</span></div>${has?`<span class="cnt">🎮 ${count(g,S.id)} ойын</span>`:'<span class="soon">🔒 Жақында</span>'}`);
   if(has)b.onclick=()=>go('/'+g+'/'+S.id);s.append(b)});W.append(s);return}
 const sid=p[1],S=SUBJ(g).find(x=>x.id===sid)||{t:sid};let q=+p[2]||LS.get('nu_q_'+g+sid,1);if(!CAT[g+'/'+sid+'/'+q])q=1;
 $('#sub').textContent=g+'-сынып · '+S.t;back.onclick=()=>go('/'+g);
 [1,2,3,4].forEach(n=>{const has=!!CAT[g+'/'+sid+'/'+n];const b=el('button',(n===q?'on':'')+(has?'':' lock'),(has?(n===q?'⭐ ':''):'🔒 ')+n+'-тоқсан');if(has)b.onclick=()=>{LS.set('nu_q_'+g+sid,n);go('/'+g+'/'+sid+'/'+n)};$('#qs').append(b)});
 const secs=CAT[g+'/'+sid+'/'+q];if(!secs){W.append(el('div','empty','<div>🛠️</div>Ойындар дайындалуда'));return}
 let n=0;const STARS=LS.get('nu_stars',{});
 secs.forEach(sec=>{const s=el('section','sec',`<div class="sh"><div class="si" style="background:#fff">${sec.em}</div><h2>${sec.t}</h2><span>${sec.g.length} ойын</span></div>`);const gr=el('div','grid');s.append(gr);
  sec.g.forEach(([id,e,t,d,m])=>{n++;const key=g+'/'+sid+'/'+q+'/'+id,st=STARS[key]||0;
   const c=el('button','card',`<span class="n">${n}</span><div class="ic" style="background:${sec.bg}">${e}</div><b>${t}</b><p>${d}</p><span class="md ${m}">${MODES[m]}</span><span class="st">${'★'.repeat(st)}<i>${'★'.repeat(3-st)}</i></span>`);
   c.onclick=()=>openGame({g,sid,q,id,e,t,d,m,bg:sec.bg});gr.append(c)});W.append(s)})}
function count(g,sid){let c=0;Object.keys(CAT).filter(k=>k.startsWith(g+'/'+sid+'/')).forEach(k=>CAT[k].forEach(s=>c+=s.g.length));return c}

let CUR=null,LV=1;
function openGame(o){CUR=o;$('#mic').textContent=o.e;$('#mic').style.background=o.bg;$('#mt').textContent=o.t;$('#mp').textContent=o.d+' · '+MODES[o.m];
 LV=LS.get('nu_lv_'+o.id,1);document.querySelectorAll('#lvs button').forEach(b=>b.classList.toggle('on',+b.dataset.l===LV));$('#ov').classList.add('on')}
document.querySelectorAll('#lvs button').forEach(b=>b.onclick=()=>{LV=+b.dataset.l;document.querySelectorAll('#lvs button').forEach(x=>x.classList.toggle('on',x===b))});
$('#go').onclick=()=>{LS.set('nu_lv_'+CUR.id,LV);location.href=`oyin.html?g=${CUR.g}&s=${CUR.sid}&q=${CUR.q}&id=${CUR.id}&lv=${LV}&v=34`};
$('#mx').onclick=()=>$('#ov').classList.remove('on');$('#ov').onclick=e=>{if(e.target===$('#ov'))$('#ov').classList.remove('on')};
addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('on')});
addEventListener('hashchange',route);route();
</script>
</body>
</html>
